@if ($addPolygonFloatingWindowService.toolName) {
  <floating-window
    [contentTemplate]="contentTemplate"
    [parentName]="$addPolygonFloatingWindowService.toolName"
  />
}

<ng-template #contentTemplate>
  <div class="add-polygon-floating-window-content-wrapper">
    <div class="add-polygon-floating-window-private">
      @if ($addPolygonFloatingWindowService.validPickedEnttity()?.id?.includes('-polygon-')) {
        <div class="add-polygon-floating-window-private-info">
          <div class="add-polygon-floating-window-private-naming">
            <span>Наименование:</span>
            <input
              maxlength="70"
              placeholder="Введите наименование"
              matTooltip="Наименование"
              matTooltipShowDelay="1000"
              [value]="$addPolygonFloatingWindowService.validPickedEnttity()?.name"
              (input)="
                $toolsService.changeEntityName(
                  $event.target.value,
                  $addPolygonFloatingWindowService.validPickedEnttity()!.id,
                  this.$drawingService.addPolygonEntitiesList,
                  $event.target.value
                )
              "
            />
          </div>
        </div>
        <div class="add-polygon-floating-window-private-settings">
          <div class="add-polygon-floating-window-private-color">
            <span>Цвет:</span>
            <input
              type="color"
              matTooltip="Цвет"
              matTooltipShowDelay="1000"
              [value]="
                $addPolygonFloatingWindowService
                  .validPickedEnttity()
                  ?.polyline?.material?.getValue()
                  .color.toCssHexString()
              "
              (change)="
                $toolsService.changeEntityColor(
                  $event.target.value,
                  $addPolygonFloatingWindowService.validPickedEnttity()!.id,
                  this.$drawingService.addPolygonEntitiesList
                )
              "
            />
          </div>
        </div>
      }
    </div>
  </div>
</ng-template>
